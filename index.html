<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <!-- mirrors --color-surface-sunken in theme.css; keep in sync on palette changes -->
    <meta name="theme-color" content="#0b132b" />
    <script>
      // Re-apply the saved world colours before first paint so a chosen theme
      // loads with zero flash of the default. Snapshot written by themes.ts
      // (applyThemeToDom) under the same key.
      try {
        var lgTheme = JSON.parse(localStorage.getItem("lg:theme-css") || "null");
        if (lgTheme && lgTheme.vars) {
          for (var lgVar in lgTheme.vars) {
            document.documentElement.style.setProperty(lgVar, lgTheme.vars[lgVar]);
          }
          document.documentElement.style.colorScheme = lgTheme.light ? "light" : "dark";
          var lgMeta = document.querySelector('meta[name="theme-color"]');
          if (lgMeta && lgTheme.themeColor) lgMeta.setAttribute("content", lgTheme.themeColor);
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Learning Globe — a free, gamified world map. Spin the globe, pin your guess, discover every country on Earth."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%230b132b%22/><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22none%22 stroke=%22%235bc0be%22 stroke-width=%224%22/><path d=%22M50 10a40 40 0 000 80M50 10a40 40 0 010 80M10 50h80M18 30h64M18 70h64%22 fill=%22none%22 stroke=%22%236fffe9%22 stroke-width=%222.5%22/></svg>"
    />
    <title>Learning Globe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
